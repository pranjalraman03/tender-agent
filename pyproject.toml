[project]
name = "tender-agent"
version = "0.1.0"
description = "Matches Indian MSMEs to government tenders they can bid on"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg",
    "alembic",
    "pgvector",
    "structlog",
    "apscheduler>=3.10,<4",
    "httpx",
    "selectolax",
    "anthropic>=2.3.0",
    "boto3>=1.43.118",
    "pymupdf>=2.0",
    "ocrmypdf>=17.13.0",
    "fastembed>=0.9.1",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "sentry-sdk>=2.73.0",
    "langfuse>=5.0.4",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pre-commit",
    "boto3-stubs>=1.43.118",
    "types-boto3>=1.43.118",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "apps"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "DTZ"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "E501"]
"core/db/migrations/**" = ["E501"]
# Interactive CLI: blocking file reads in async code are fine here.
"evals/label_tool.py" = ["ASYNC240"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["core.*"]
strict = true

# PyMuPDF ships partial type hints; its Page/Document methods are untyped.
[[tool.mypy.overrides]]
module = ["core.parsing.pdf", "evals.*"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["slow: loads local embedding models (seconds, first run downloads them)"]
filterwarnings = ["ignore::DeprecationWarning:importlib._bootstrap"]
